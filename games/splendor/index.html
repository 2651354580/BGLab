<body>

<script>
// 等待 bridge 连接，然后通过 WS 接收游戏配置
(function() {
  Bridge.init();
  const loading = document.getElementById('init-loading');
  const check = setInterval(() => {
    if (Bridge._ready) {
      clearInterval(check);
      if (loading) loading.textContent = '已连接，等待游戏开始...';
    }
  }, 200);
})();
</script>
