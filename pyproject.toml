[project]
name = "bglab"
version = "0.1.2"
license = "MIT"
description = "Play browser board games with your own AI models"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.122.0",
    "jsonschema==4.26.0",
    "openai==3.1.0",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "rich==15.0.0",
    "textual==8.2.8",
    "websockets==17.0.1",
]

[project.scripts]
bglab = "bglab.cli_textual:main"
bglab-textual = "bglab.cli_textual:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bglab"]
